<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horloge pastel (small)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --pink: #ffb7c9;
      --peach:#ffc7a8;

      /* Fond doux comme la capture */
      --frame1: rgba(199,180,255,0.55);
      --frame2: rgba(255,209,218,0.70);

      --cardBg: rgba(255, 236, 244, 0.32);
      --cardBorder: rgba(255,255,255,0.40);
      --shadow: rgba(180, 120, 160, 0.18);
    }

    html, body { height: 100%; }
    body{
      margin:0;
      display:grid;
      place-items:center;
      background: transparent;
      font-family: "Baloo 2", ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    /* IMPORTANT: petit widget -> largeur “colonne Notion” */
    .frame{
      width: 260px;           /* ajuste à 220–320 selon ta colonne */
      border-radius: 22px;
      padding: 14px;
      background: linear-gradient(180deg, var(--frame1), var(--frame2));
      border: 1px solid rgba(255,255,255,0.26);
      box-shadow: 0 14px 36px rgba(0,0,0,0.10);
    }

    .card{
      border-radius: 18px;
      padding: 12px 12px 10px;
      background: var(--cardBg);
      border: 1px solid var(--cardBorder);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.25),
                  0 10px 22px var(--shadow);
    }

    .time{
      font-size: 52px;        /* petit widget, mais “hero” */
      line-height: 1;
      letter-spacing: -0.02em;

      background: linear-gradient(180deg, var(--peach) 0%, var(--pink) 60%, #ffa7c1 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 8px 18px rgba(255, 140, 180, 0.20),
        0 2px 0 rgba(255,255,255,0.30);
    }

    .date{
      margin-top: 6px;
      font-size: 14px;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.80);
      text-shadow: 0 2px 10px rgba(150,90,150,0.10);
      text-transform: capitalize;
      white-space: nowrap;    /* garde sur une ligne */
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

<body>
  <div class="frame">
    <div class="card">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date">---</div>
    </div>
  </div>

  <script>
    const fmtTime = new Intl.DateTimeFormat("fr-FR", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    });

    // Date courte et clean pour petit widget
    // ex: "mercredi 2 septembre"
    const fmtDate = new Intl.DateTimeFormat("fr-FR", {
      weekday: "long",
      day: "numeric",
      month: "long"
    });

    function tick(){
      const now = new Date();
      document.getElementById("time").textContent = fmtTime.format(now);
      document.getElementById("date").textContent = fmtDate.format(now);
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
